data:
  type: babytheorist_pairs
  train: [data/babytheorist/single_a/lv1_train.h5]
  evals: {lv1: data/babytheorist/single_a/lv1_eval.h5}
model:
  type: neo
  encoder: {type: token_embed, vocab: 10, d_model: 128}
  decoder:
    type: linear_head
    d_model: 128
    vocab: 10
    layer_norm_eps: 1.0e-06
    spatial: [15, 15]
  programmer: {type: token_pair_transformer, state_dim: 128, d_model: 256, action_dim: 16, num_heads: 8, d_ff: 1024, num_layers: 3, grid_dim: 15, dropout: 0.0, layer_norm_eps: 1.0e-06}
  code: {type: vq_restart, size: 16, dim: 16, num_tokens: 1, commitment: 0.25, stochastic: false, commitment_grad: true, restart_every: 100, restart_below: 0.1, usage_decay: 0.99, restart_until: 6000}
  executor: {type: adaln_transformer, state_dim: 128, cond_dim: 16, d_model: 256, num_layers: 4, num_heads: 8, d_ff: 1024, dropout: 0.0, grid_dim: 15}
  max_length: 5
  length_coefficient: 0.95
  state_update: reencode_soft
method:
  type: neo
  lr: 0.0003
  programmer_lr_scale: 0.25
  executor_lr_scale: 1.0
  weight_decay: 0.01
  warmup_ratio: 0.05
  min_lr_ratio: 0.1
  grad_clip: 1.0
  grounding_weight: 0.1
  code_weight: 1.0
  auto_weight: 0.0
  total_steps: 12000
  freeze: [encoder, decoder]
  code_loss_scope: prefix
evals:
- type: babytheorist_observe
  name: observe
  every: 1200
  split: lv1
  batch_size: 250
  max_samples: 2000
  tables: false
  infer: &id001 {max_steps: 5, rollout: carry}
- type: babytheorist_observe
  name: observe_full
  every: 12000
  split: lv1
  batch_size: 250
  infer: *id001
train: {steps: 12000, batch_size: 512, seed: 42, precision: bf16, ckpt_every: 3000, log_every: 50, num_workers: 0, init_from: runs/codec_token/ckpt/step-003000.pt, wandb_project: toy-neo, wandb_mode: disabled,
  ema: 0.999, compile: parts}
