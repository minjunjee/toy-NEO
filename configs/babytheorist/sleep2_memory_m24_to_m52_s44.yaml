data:
  type: babytheorist_episodes
  train: [data/babytheorist/memory_round2_mem_s44_rep/lv1_train.h5, data/babytheorist/many_p24_pairs2/lv1_train.h5]
  evals: {lv1: data/babytheorist/many_p52_without4_unstreamed1600/lv1_eval.h5, usual: data/babytheorist/many_p24/lv1_eval.h5}
  train_max_depth: 1
model:
  type: neo_em
  encoder: {type: token_embed, vocab: 10, d_model: 128}
  decoder:
    type: linear_head
    d_model: 128
    vocab: 10
    layer_norm_eps: 1.0e-06
    spatial: [15, 15]
  programmer: {type: token_pair_transformer, state_dim: 128, d_model: 256, action_dim: 16, num_heads: 8, d_ff: 1024, num_layers: 6, grid_dim: 15, dropout: 0.0, layer_norm_eps: 1.0e-06}
  code: {type: vq, size: 104, dim: 16, num_tokens: 1, commitment: 0.25, stochastic: false, commitment_grad: true}
  executor: {type: adaln_transformer, state_dim: 128, cond_dim: 16, d_model: 128, num_layers: 4, num_heads: 8, d_ff: 512, dropout: 0.0, grid_dim: 15}
  max_length: 1
  length_coefficient: 0.95
  state_update: reencode_soft
  candidates: 0
  train_top: 1
  temperature_start: 0.01
  temperature_end: 0.01
  anneal_steps: 1
  dead_share: 0.1
  usage_decay: 0.99
  bonus_step: 0.05
  bonus_cap: 20.0
method:
  type: neo_em
  lr: 0.0003
  programmer_lr_scale: 0.25
  executor_lr_scale: 1.0
  weight_decay: 0.01
  warmup_ratio: 0.05
  min_lr_ratio: 0.1
  grad_clip: 1.0
  grounding_weight: 0.1
  code_weight: 1.0
  auto_weight: 0.0
  total_steps: 1000
  freeze: [encoder, decoder]
  code_loss_scope: prefix
evals:
- type: babytheorist_observe
  name: observe
  every: 500
  split: lv1
  batch_size: 250
  max_samples: 2000
  tables: true
  infer: &id001 {max_steps: 1, rollout: carry}
- type: babytheorist_observe
  name: observe_full
  every: 1000
  split: lv1
  batch_size: 250
  infer: *id001
- {type: codebook_snapshot, name: snapshot, every: 200, split: lv1, max_tasks: 1024, max_samples: 4000}
- {type: codebook_snapshot, name: snapshot_usual, every: 500, split: usual, max_tasks: 1024, max_samples: 4000}
train: {steps: 1000, batch_size: 128, seed: 44, precision: bf16, ckpt_every: 1000, log_every: 50, num_workers: 0, init_from: runs/sleep_memory_m24_to_m52_s44/ckpt/step-002000.pt, wandb_project: toy-neo,
  wandb_mode: disabled, ema: 0.0, compile: parts}
