data:
  type: babytheorist_pairs
  train: [data/babytheorist/many_p24/lv1_train.h5]
  evals: {lv1: data/babytheorist/many_p24/lv1_eval.h5}
model:
  type: neo_em
  encoder: {type: token_embed, vocab: 10, d_model: 128}
  decoder:
    type: linear_head
    d_model: 128
    vocab: 10
    layer_norm_eps: 1.0e-06
    spatial: [15, 15]
  programmer: {type: token_pair_transformer, state_dim: 128, d_model: 256, action_dim: 16, num_heads: 8, d_ff: 1024, num_layers: 6, grid_dim: 15, dropout: 0.0, layer_norm_eps: 1.0e-06}
  code: {type: vq, size: 48, dim: 16, num_tokens: 1, commitment: 0.25, stochastic: false, commitment_grad: true}
  executor: {type: adaln_transformer, state_dim: 128, cond_dim: 16, d_model: 128, num_layers: 4, num_heads: 8, d_ff: 512, dropout: 0.0, grid_dim: 15}
  max_length: 1
  length_coefficient: 0.95
  state_update: reencode_soft
  candidates: 0
  train_top: 1
  temperature_start: 0.01
  temperature_end: 0.01
  anneal_steps: 1
  dead_share: 0.1
  usage_decay: 0.99
  bonus_step: 0.05
  bonus_cap: 20.0
method:
  type: neo_dream
  lr: 0.0003
  programmer_lr_scale: 0.25
  executor_lr_scale: 1.0
  weight_decay: 0.01
  warmup_ratio: 0.05
  min_lr_ratio: 0.1
  grad_clip: 1.0
  grounding_weight: 0.1
  code_weight: 1.0
  auto_weight: 0.0
  total_steps: 6000
  freeze: [encoder, decoder, executor, code]
  code_loss_scope: prefix
  real_share: 0.5
evals:
- type: babytheorist_observe
  name: observe
  every: 600
  split: lv1
  batch_size: 250
  max_samples: 2000
  tables: false
  infer: {max_steps: 4, rollout: hard}
- type: babytheorist_observe
  name: observe_full
  every: 6000
  split: lv1
  batch_size: 250
  infer: {max_steps: 4, rollout: hard}
train: {steps: 6000, batch_size: 128, seed: 43, precision: bf16, ckpt_every: 6000, log_every: 50, num_workers: 0, init_from: runs/onestep_s_m24_hardem_pairs2_price_reach4_s43/ckpt/step-024000.pt, wandb_project: toy-neo,
  wandb_mode: disabled, ema: 0.0, compile: parts}
