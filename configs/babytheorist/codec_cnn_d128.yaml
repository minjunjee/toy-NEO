data:
  type: babytheorist_pairs
  train: [data/babytheorist/single_a/lv1_train.h5, data/babytheorist/single_a_2obj/lv1_train.h5, data/babytheorist/single_a_3obj/lv1_train.h5]
  evals: {objects1: data/babytheorist/single_a/lv1_eval.h5, objects2: data/babytheorist/single_a_2obj/lv1_eval.h5, objects3: data/babytheorist/single_a_3obj/lv1_eval.h5}
model:
  type: vae
  encoder: {type: cnn_vae_any, grid_size: 15, num_colors: 10, state_dim: 128, num_state_tokens: 1, dropout: 0.1, variational: true, deterministic: false}
  decoder: {type: cnn_vae_any, grid_size: 15, num_colors: 10, state_dim: 128, num_state_tokens: 1, dropout: 0.1}
method: {type: vae_pretrain, lr: 0.005, weight_decay: 0.01, warmup_ratio: 0.1, min_lr_ratio: 0.005, grad_clip: 1.0, kl_weight: 0.0, total_steps: 40000}
evals:
- {type: reconstruct_exact, every: 4000, split: objects1, batch_size: 1024}
- {type: reconstruct_exact, every: 4000, split: objects2, batch_size: 1024}
- {type: reconstruct_exact, every: 4000, split: objects3, batch_size: 1024}
train: {steps: 40000, batch_size: 2048, seed: 42, precision: bf16, ckpt_every: 8000, log_every: 50, num_workers: 0, init_from: null, wandb_project: toy-neo, wandb_mode: disabled}
