data:
  type: babytheorist_pairs
  train: [data/babytheorist/shifts24_without4/lv1_train.h5]
  evals: {lv1: data/babytheorist/shifts24_without4/lv1_eval.h5}
  train_max_depth: 1
model:
  type: neo
  encoder: {type: token_embed, vocab: 10, d_model: 128}
  decoder:
    type: linear_head
    d_model: 128
    vocab: 10
    layer_norm_eps: 1.0e-06
    spatial: [15, 15]
  programmer: {type: token_pair_transformer, state_dim: 128, d_model: 256, action_dim: 16, num_heads: 8, d_ff: 1024, num_layers: 6, grid_dim: 15, dropout: 0.0, layer_norm_eps: 1.0e-06}
  code:
    type: vq_orbit
    size: 48
    dim: 16
    num_tokens: 1
    commitment: 0.25
    stochastic: false
    commitment_grad: true
    family: line
    kinds: 6
    amounts: [1, 2, 3, 4, 5, 6, 7, 8]
  executor: {type: adaln_transformer, state_dim: 128, cond_dim: 16, d_model: 128, num_layers: 4, num_heads: 8, d_ff: 512, dropout: 0.0, grid_dim: 15}
  max_length: 1
  length_coefficient: 0.95
  state_update: reencode_soft
method:
  type: neo_compose
  lr: 0.0003
  programmer_lr_scale: 0.25
  executor_lr_scale: 1.0
  weight_decay: 0.01
  warmup_ratio: 0.05
  min_lr_ratio: 0.1
  grad_clip: 1.0
  grounding_weight: 0.1
  code_weight: 1.0
  auto_weight: 0.0
  total_steps: 24000
  freeze: [encoder, decoder]
  code_loss_scope: prefix
  compose_weight: 1.0
evals:
- type: babytheorist_observe
  name: observe
  every: 2400
  split: lv1
  batch_size: 250
  max_samples: 2000
  tables: false
  infer: &id001 {max_steps: 1, rollout: carry}
- type: babytheorist_observe
  name: observe_full
  every: 24000
  split: lv1
  batch_size: 250
  infer: *id001
train: {steps: 24000, batch_size: 128, seed: 42, precision: bf16, ckpt_every: 24000, log_every: 50, num_workers: 0, init_from: runs/codec_token/ckpt/step-003000.pt, wandb_project: toy-neo, wandb_mode: disabled,
  ema: 0.0, compile: parts}
