data:
  type: gridworld_pairs
  sampling: episode
  train: data/gridworld/GridWorld_0107_lvl1-3_8c_10x10_1sup_4prim_sp_alpha0.33_seed1127_n100000_practice.h5
  id: data/gridworld/GridWorld_0107_lvl1-3_8c_10x10_1sup_4prim_sp_alpha0.33_seed1127_n10000_exam.h5
  ood_comp: data/gridworld/GridWorld_0107_lvl1-3_8c_10x10_1sup_4prim_sp_alpha0.33_seed1127_n10000_ood_test.h5
  ood_len: data/gridworld/GridWorld_0107_lvl4-8_8c_10x10_1sup_4prim_sp_alpha1.00_seed1127_n20000_exam.h5
model:
  type: neo
  encoder: {type: cnn_vae, grid_size: 10, num_colors: 9, state_dim: 32, num_state_tokens: 1, dropout: 0.0, variational: true, deterministic: true}
  decoder: {type: cnn_vae, grid_size: 10, num_colors: 9, state_dim: 32, num_state_tokens: 1, dropout: 0.0}
  programmer: {type: film_mlp, state_dim: 32, action_dim: 16, num_state_tokens: 1, num_action_tokens: 1, hidden: 128, max_length: 4, dropout: 0.0}
  code: {type: vq, size: 6, dim: 16, num_tokens: 1, commitment: 0.25, stochastic: true, tau_start: 0.3, tau_end: 0.1, tau_steps: 19550}
  executor: {type: film_mlp, state_dim: 32, action_dim: 16, num_state_tokens: 1, num_action_tokens: 1, hidden: 128, residual: true, dropout: 0.0}
  max_length: 4
  length_coefficient: 0.95
  state_update: carry_latent
method: {type: neo, lr: 5.0e-4, programmer_lr_scale: 0.25, executor_lr_scale: 1.0, weight_decay: 0.01, warmup_ratio: 0.10, min_lr_ratio: 0.1, grad_clip: 1.0, grounding_weight: 0.1, code_weight: 1.0, auto_weight: 0.0, total_steps: 39100, freeze: [encoder, decoder]}
evals:
  - {type: self_explain_exact, every: 391, split: id, batch_size: 256, infer: {max_steps: 4}}
  - {type: transfer_exact, every: 391, split: id, batch_size: 256, infer: {max_steps: 4}}
  - {type: transfer_exact, every: 3910, split: ood_comp, batch_size: 256, infer: {max_steps: 4}}
  - {type: transfer_exact, every: 3910, split: ood_len, batch_size: 256, infer: {max_steps: 10}}
train: {steps: 39100, batch_size: 128, seed: 43, precision: bf16, ckpt_every: 1955, log_every: 50, num_workers: 4, init_from: runs/vae_gw_s42/ckpt/step-066015.pt, wandb_project: generalizedL2T}
