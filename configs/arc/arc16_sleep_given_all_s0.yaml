data:
  type: arc_tasks
  train: [data/arc/sleep_evaluation_16.npz, data/arc/rearc_train_16.npz]
  evals: {heldout: data/arc/rearc_heldout_16.npz, evaluation: data/arc/arc_evaluation_16.npz, training: data/arc/arc_training_16.npz}
  pairs: 4
  color_perms: 8
  symmetries: 8
  seed: 0
  shares: [0.5, 0.5]
  named: [true, false]
model:
  type: neo_arc
  encoder: {type: token_embed, vocab: 11, d_model: 128}
  decoder:
    type: linear_head
    d_model: 128
    vocab: 11
    layer_norm_eps: 1.0e-06
    spatial: [16, 16]
  programmer: {type: token_pair_transformer, state_dim: 128, action_dim: 64, grid_dim: 16, layer_norm_eps: 1.0e-06, d_model: 256, num_heads: 8, d_ff: 1024, num_layers: 4, dropout: 0.0}
  executor: {type: adaln_transformer, state_dim: 128, cond_dim: 64, grid_dim: 16, d_model: 256, num_heads: 8, d_ff: 1024, num_layers: 6, dropout: 0.0}
  code_dim: 64
  tasks: 210
  variants: 64
  table_share: 1.0
  loops: 1
method: {type: neo_arc, lr: 0.0001, weight_decay: 0.01, warmup_ratio: 0.05, min_lr_ratio: 0.1, grad_clip: 1.0, total_steps: 4000, tie_weight: 0.0, table_lr_scale: 10.0, pad_weight: 1.0}
evals:
- {type: arc_tasks, name: during, every: 500, split: heldout, batch_size: 256, table: false}
- {type: arc_tasks, name: during, every: 500, split: evaluation, batch_size: 256, table: true, table_tasks: same, fit_steps: 30, fit_lr: 0.05}
- {type: arc_tasks, name: during, every: 500, split: training, batch_size: 256, table: false}
- type: arc_tasks
  name: final
  every: 4000
  split: heldout
  batch_size: 256
  table: false
  fit_steps: 100
  fit_lr: 0.05
  fit_report: [10, 30]
  votes: 8
- type: arc_tasks
  name: final
  every: 4000
  split: evaluation
  batch_size: 256
  table: true
  table_tasks: same
  fit_steps: 30
  fit_lr: 0.05
  fit_report: [10]
  votes: 64
- type: arc_tasks
  name: final
  every: 4000
  split: training
  batch_size: 256
  table: false
  fit_steps: 100
  fit_lr: 0.05
  fit_report: [10, 30]
  votes: 8
train: {steps: 4000, batch_size: 64, seed: 0, precision: bf16, ckpt_every: 4000, log_every: 50, num_workers: 4, init_from: runs/arc16_programmer_s0/ckpt/grown_evaluation.pt, wandb_project: toy-neo, wandb_mode: disabled,
  compile: parts}
