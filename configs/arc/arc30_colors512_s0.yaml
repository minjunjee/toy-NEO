data:
  type: arc_tasks
  train: data/arc/rearc_train_30.npz
  evals: {heldout: data/arc/rearc_heldout_30.npz, evaluation: data/arc/arc_evaluation_30.npz, training: data/arc/arc_training_30.npz}
  pairs: 4
  color_perms: 512
  symmetries: 8
  seed: 0
model:
  type: neo_arc
  encoder: {type: token_embed, vocab: 11, d_model: 128}
  decoder:
    type: linear_head
    d_model: 128
    vocab: 11
    layer_norm_eps: 1.0e-06
    spatial: [30, 30]
  programmer: {type: token_pair_transformer, state_dim: 128, action_dim: 256, grid_dim: 30, layer_norm_eps: 1.0e-06, d_model: 256, num_heads: 8, d_ff: 1024, num_layers: 4, dropout: 0.0}
  executor: {type: adaln_transformer, state_dim: 128, cond_dim: 256, grid_dim: 30, d_model: 384, num_heads: 8, d_ff: 1536, num_layers: 8, dropout: 0.0}
  code_dim: 256
  tasks: 0
  variants: 4096
  table_share: 0.5
  loops: 1
method: {type: neo_arc, lr: 0.0003, weight_decay: 0.01, warmup_ratio: 0.02, min_lr_ratio: 0.1, grad_clip: 1.0, total_steps: 200000, tie_weight: 1.0, table_lr_scale: 1.0, pad_weight: 1.0}
evals:
- {type: arc_tasks, name: during, every: 10000, split: heldout, batch_size: 256, table: false}
- {type: arc_tasks, name: during, every: 10000, split: evaluation, batch_size: 256, table: false}
- {type: arc_tasks, name: during, every: 10000, split: training, batch_size: 256, table: false}
- type: arc_tasks
  name: final
  every: 200000
  split: heldout
  batch_size: 256
  table: false
  fit_steps: 30
  fit_lr: 0.05
  fit_report: [10, 30]
  votes: 1
- type: arc_tasks
  name: final
  every: 200000
  split: evaluation
  batch_size: 256
  table: false
  fit_steps: 30
  fit_lr: 0.05
  fit_report: [10, 30]
  votes: 1
- type: arc_tasks
  name: final
  every: 200000
  split: training
  batch_size: 256
  table: false
  fit_steps: 30
  fit_lr: 0.05
  fit_report: [10, 30]
  votes: 1
train: {steps: 200000, batch_size: 64, seed: 0, precision: bf16, ckpt_every: 25000, log_every: 50, num_workers: 8, init_from: null, wandb_project: toy-neo, wandb_mode: disabled, compile: parts}
